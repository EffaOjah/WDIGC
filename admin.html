<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WDIGC Admin Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #090d16;
      --navy-900: #131924;
      --royal: #c5a368;
      --gold: #c5a368;
      --white: #ffffff;
      --muted: rgba(255, 255, 255, 0.6);
      --border: rgba(255, 255, 255, 0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--navy);
      color: var(--white);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }

    #loginSection {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-card {
      background: var(--navy-900);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .login-card h1 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin-bottom: 24px;
      color: var(--gold);
    }

    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--muted); }
    input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      color: white;
      outline: none;
    }

    button {
      width: 100%;
      background: var(--royal);
      color: var(--navy);
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover { background: #d6b885; }

    #adminDashboard { display: none; padding: 40px; }
    .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
    .dashboard-grid { display: grid; grid-template-columns: 350px 1fr; gap: 40px; }

    .card {
      background: var(--navy-900);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 30px;
    }

    h2 { font-family: 'Plus Jakarta Sans', sans-serif; margin-bottom: 20px; }

    .sermon-list { display: grid; gap: 15px; }
    .sermon-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      padding: 15px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-delete { background: #ef4444; width: auto; padding: 8px 12px; font-size: 0.8rem; }
    
    .status-msg { margin-top: 15px; font-size: 0.9rem; }
    .success { color: #10b981; }
    .error { color: #ef4444; }
  </style>
</head>
<body>

  <section id="loginSection">
    <div class="login-card">
      <h1>Admin Portal</h1>
      <form id="loginForm">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit">Login to Dashboard</button>
      </form>
      <div id="loginMsg" class="status-msg"></div>
    </div>
  </section>

  <section id="adminDashboard">
    <div class="dashboard-header">
      <h1>Dashboard Overview</h1>
      <button onclick="logout()" style="width: auto; padding: 10px 20px; background: rgba(255,255,255,0.1)">Logout</button>
    </div>

    <div class="dashboard-grid">
      <div class="card">
        <h2>Add New Sermon</h2>
        <form id="sermonForm">
          <div class="form-group">
            <label>Title</label>
            <input type="text" id="sermonTitle" required>
          </div>
          <div class="form-group">
            <label>YouTube Video ID (e.g. dQw4w9WgXcQ)</label>
            <input type="text" id="sermonVideoId">
          </div>
          <div class="form-group">
            <label>Full Link</label>
            <input type="text" id="sermonLink">
          </div>
          <div class="form-group">
            <label>Thumbnail Image</label>
            <input type="file" id="sermonThumb">
          </div>
          <button type="submit">Publish Sermon</button>
        </form>
        <div id="sermonMsg" class="status-msg"></div>
      </div>

      <div class="card">
        <h2>Manage Sermons</h2>
        <div id="sermonList" class="sermon-list">
          <!-- Sermons will appear here -->
        </div>
      </div>
    </div>
  </section>

  <script>
    const API_URL = 'http://localhost:5000/api';
    let token = localStorage.getItem('wdigc_token');

    if (token) {
      showDashboard();
    }

    // Login Handling
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const loginMsg = document.getElementById('loginMsg');
      
      try {
        const response = await fetch(`${API_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });

        const data = await response.json();
        if (data.success) {
          localStorage.setItem('wdigc_token', data.token);
          token = data.token;
          showDashboard();
        } else {
          loginMsg.innerHTML = `<span class="error">${data.message}</span>`;
        }
      } catch (err) {
        loginMsg.innerHTML = `<span class="error">Server error</span>`;
      }
    });

    function showDashboard() {
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('adminDashboard').style.display = 'block';
      loadSermons();
    }

    function logout() {
      localStorage.removeItem('wdigc_token');
      location.reload();
    }

    // Load Sermons
    async function loadSermons() {
      const sermonList = document.getElementById('sermonList');
      try {
        const response = await fetch(`${API_URL}/sermons`);
        const data = await response.json();
        
        sermonList.innerHTML = data.data.map(s => `
          <div class="sermon-item">
            <div>
              <strong>${s.title}</strong><br>
              <small>${s.video_id || 'No video ID'}</small>
            </div>
            <button class="btn-delete" onclick="deleteSermon(${s.id})">Delete</button>
          </div>
        `).join('');
      } catch (err) {
        sermonList.innerHTML = 'Error loading sermons';
      }
    }

    // Create Sermon
    document.getElementById('sermonForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const sermonMsg = document.getElementById('sermonMsg');
      const formData = new FormData();
      formData.append('title', document.getElementById('sermonTitle').value);
      formData.append('video_id', document.getElementById('sermonVideoId').value);
      formData.append('link', document.getElementById('sermonLink').value);
      
      const fileInput = document.getElementById('sermonThumb');
      if (fileInput.files[0]) {
        formData.append('thumbnail', fileInput.files[0]);
      }

      try {
        const response = await fetch(`${API_URL}/sermons`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` },
          body: formData
        });

        const data = await response.json();
        if (data.success) {
          sermonMsg.innerHTML = `<span class="success">Sermon added!</span>`;
          document.getElementById('sermonForm').reset();
          loadSermons();
        } else {
          sermonMsg.innerHTML = `<span class="error">${data.message}</span>`;
        }
      } catch (err) {
        sermonMsg.innerHTML = `<span class="error">Upload failed</span>`;
      }
    });

    async function deleteSermon(id) {
      if (!confirm('Are you sure?')) return;
      try {
        const response = await fetch(`${API_URL}/sermons/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await response.json();
        if (data.success) loadSermons();
      } catch (err) {
        alert('Delete failed');
      }
    }
  </script>
</body>
</html>
